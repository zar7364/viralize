<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#00cbd5" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Viralize | AI Content Orchestrator</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Service worker sebelumnya cache index.html secara permanen (cache-first,
      // nama cache statis) - setelah deploy baru, browser yang sudah pernah
      // install service worker itu tetap disajikan index.html versi lama yang
      // menunjuk ke file JS/CSS yang sudah tidak ada lagi di server (halaman
      // putih kosong sampai hard refresh). Bersihkan yang sudah terlanjur
      // terpasang di browser user, jangan daftarkan lagi yang baru.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          registrations.forEach((registration) => registration.unregister());
        });
      }
      if ('caches' in window) {
        caches.keys().then((names) => {
          names.forEach((name) => caches.delete(name));
        });
      }
    </script>
  </body>
</html>
